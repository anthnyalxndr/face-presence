name: Feature request
description: An idea or an improvement. The owner turns accepted requests into tasks.
title: '<what you want to be able to do>'
labels: ['feature-request']
body:
  - type: textarea
    id: description
    attributes:
      label: Description
      description: What you want and what it would let you do.
    validations:
      required: true
  - type: textarea
    id: why
    attributes:
      label: Why it matters
    validations:
      required: true
