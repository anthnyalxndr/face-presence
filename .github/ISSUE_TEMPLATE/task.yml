name: Task
description: A unit of work with testable acceptance criteria. Add the agent label only if an unattended agent may do it alone.
title: '<outcome-focused title>'
labels: ['priority:medium']
body:
  - type: textarea
    id: description
    attributes:
      label: Description
      description: The why and the outcome, not implementation steps.
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: One checkbox per criterion. Each must be checkable by a test or a command. One to seven.
      value: |
        - [ ]
    validations:
      required: true
  - type: textarea
    id: pointers
    attributes:
      label: Pointers
      description: Files or modules to change, and ones to leave alone.
  - type: textarea
    id: notes
    attributes:
      label: Notes
      description: Links, constraints, context. Name the parent initiative (planning repo issue) if there is one.
